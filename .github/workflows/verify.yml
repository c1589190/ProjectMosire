name: verify

# 每个 push / PR 都跑完整 Maven 门禁（Spotless → Checkstyle → SpotBugs → Surefire），
# 发布工作流复用同一命令，避免“本地/发布/合并”三套判据。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 核对模块边界
        run: python3 scripts/check-module-boundaries.py

      - name: 完整门禁
        run: ./mvnw -B verify

      - name: 核对三库公开 API 兼容
        run: python3 scripts/release-artifacts.py compat

      - name: 验收完整服务 ZIP
        run: |
          set -euo pipefail
          version="$(python3 scripts/release-artifacts.py version)"
          python3 scripts/check-server-distribution.py "MainMosire/target/mosire-server-${version}.zip"
