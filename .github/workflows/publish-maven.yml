name: publish-maven

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "与根 POM 一致的固定版本，例如 0.2.7"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      service-artifact: ${{ steps.service.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 校验发布版本与根 POM 一致
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release-artifacts.py version --release)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$INPUT_VERSION" = "$version"
          fi
          printf 'PUBLISH_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\nrevision=%s\n' "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/release-artifacts.py release-tag

      - name: 读取 Pages 历史并拒绝覆盖已发布版本
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null; then
            git fetch --depth=1 --no-tags origin refs/heads/gh-pages
            ref="$(git rev-parse FETCH_HEAD)"
            python3 scripts/release-artifacts.py unused-version --history-ref "$ref"
            printf 'PAGES_HISTORY_REF=%s\n' "$ref" >> "$GITHUB_ENV"
          else
            rc=$?
            test "$rc" -eq 2
            python3 scripts/release-artifacts.py unused-version
          fi

      - name: 核对模块边界
        run: python3 scripts/check-module-boundaries.py

      - name: 发布前完整门禁
        run: ./mvnw -B verify

      - name: 验收完整服务 ZIP
        run: python3 scripts/check-server-distribution.py "MainMosire/target/mosire-server-${PUBLISH_VERSION}.zip"

      - name: 构建并部署到本地 Maven 暂存目录
        # 全仓 verify 已覆盖静态分析，deploy 再执行四库的测试。
        run: |
          set -euo pipefail
          test ! -e target/pages
          ./mvnw -B -Ppublication -Dspotbugs.skip=true -pl BrainMosire -am deploy \
            "-DaltDeploymentRepository=pages::file://$PWD/target/pages"

      - name: 核对暂存制品、生成落地页与版本索引
        run: |
          set -euo pipefail
          history=()
          if [[ -n "${PAGES_HISTORY_REF:-}" ]]; then
            history=(--history-ref "$PAGES_HISTORY_REF")
          fi
          python3 scripts/release-artifacts.py prepare-pages target/pages "${history[@]}"

      - name: 核对三库公开 API 兼容
        run: python3 scripts/release-artifacts.py compat --repository target/pages

      - name: 从独立工程运行暂存 SDK
        run: python3 scripts/release-artifacts.py sdk target/pages

      - name: 计算服务 ZIP 的 SHA-256
        working-directory: MainMosire/target
        run: |
          set -euo pipefail
          zip="mosire-server-${PUBLISH_VERSION}.zip"
          sha256sum "$zip" > "$zip.sha256"

      - name: 保存已验收的服务制品
        id: service
        uses: actions/upload-artifact@v4
        with:
          name: mosire-server
          if-no-files-found: error
          overwrite: true
          path: |
            MainMosire/target/mosire-server-${{ env.PUBLISH_VERSION }}.zip
            MainMosire/target/mosire-server-${{ env.PUBLISH_VERSION }}.zip.sha256

      - name: 在推送 Pages 前绑定发行标签
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/release-artifacts.py release-tag --create
          else
            python3 scripts/release-artifacts.py release-tag --require
          fi

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/pages
          publish_branch: gh-pages
          keep_files: true

  server-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.revision }}

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish.outputs.service-artifact }}
          merge-multiple: true

      - name: 核对标签和服务 SHA-256
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-artifacts.py release-tag --require
          zip="mosire-server-${PUBLISH_VERSION}.zip"
          sha256sum -c "$zip.sha256"

      - name: 发布服务 ZIP 与校验和
        uses: actions/github-script@v7
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { createHash } = require('node:crypto');
            const version = process.env.PUBLISH_VERSION;
            const tag = `v${version}`;
            const zip = `mosire-server-${version}.zip`;
            const prerelease = version.endsWith('-early');
            const earlyFields = prerelease ? { prerelease: true, make_latest: 'false' } : {};
            const mavenPage = `https://c1589190.github.io/ProjectMosire/release-${version}.html`;
            const repo = context.repo;
            const releases = github.rest.repos;
            const matches = await github.paginate(
              releases.listReleases, { ...repo, per_page: 100 },
              response => response.data.filter(candidate => candidate.tag_name === tag)
            );
            if (matches.length > 1) throw new Error(`同一标签存在多个 Release ${tag}`);
            let release = matches[0];
            if (prerelease && release && !release.draft && !release.prerelease) {
              throw new Error(`已有 Release 的预发行标记不匹配 ${tag}`);
            }
            if (!release) {
              ({ data: release } = await releases.createRelease({
                ...repo, ...earlyFields, tag_name: tag, generate_release_notes: true, draft: true
              }));
            }
            const assets = await github.paginate(releases.listReleaseAssets, {
              ...repo, release_id: release.id
            });
            for (const name of [zip, `${zip}.sha256`]) {
              const data = readFileSync(name);
              const existing = assets.find(asset => asset.name === name);
              const digest = `sha256:${createHash('sha256').update(data).digest('hex')}`;
              if (existing) {
                if (existing.digest !== digest) throw new Error(`已有同名制品与校验值不一致 ${name}`);
              } else {
                if (!release.draft) throw new Error(`已发布的服务缺少制品 ${name}`);
                await releases.uploadReleaseAsset({
                  ...repo, release_id: release.id, name, data,
                  headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
                });
              }
            }
            if (release.draft) {
              const update = { ...repo, ...earlyFields, release_id: release.id, draft: false };
              const body = release.body ?? '';
              if (prerelease && !body.includes(mavenPage)) {
                update.body = `[Maven 预发行制品](${mavenPage})\n\n${body}`.trimEnd();
              }
              await releases.updateRelease(update);
            }
