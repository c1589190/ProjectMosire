name: publish-maven

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "与根 POM 一致的固定版本，例如 0.2.7"
        required: true

permissions:
  contents: write

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装配 JDK 21 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 校验发布版本与根 POM 一致
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release-artifacts.py version --release)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$INPUT_VERSION" = "$version"
          fi
          printf 'PUBLISH_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: 读取 Pages 历史并拒绝覆盖已发布版本
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null; then
            git fetch --depth=1 --no-tags origin refs/heads/gh-pages
            ref="$(git rev-parse FETCH_HEAD)"
            python3 scripts/release-artifacts.py unused-version --history-ref "$ref"
            printf 'PAGES_HISTORY_REF=%s\n' "$ref" >> "$GITHUB_ENV"
          else
            rc=$?
            test "$rc" -eq 2
            python3 scripts/release-artifacts.py unused-version
          fi

      - name: 核对模块边界
        run: python3 scripts/check-module-boundaries.py

      - name: 发布前完整门禁
        run: ./mvnw -B verify

      - name: 验收完整服务 ZIP
        run: python3 scripts/check-server-distribution.py "MainMosire/target/mosire-server-${PUBLISH_VERSION}.zip"

      - name: 构建并部署到本地 Maven 暂存目录
        # 全仓 verify 已覆盖静态分析，deploy 再执行四库的测试。
        run: |
          set -euo pipefail
          test ! -e target/pages
          ./mvnw -B -Ppublication -Dspotbugs.skip=true -pl BrainMosire -am deploy \
            "-DaltDeploymentRepository=pages::file://$PWD/target/pages"

      - name: 核对暂存制品、生成落地页与版本索引
        run: |
          set -euo pipefail
          history=()
          if [[ -n "${PAGES_HISTORY_REF:-}" ]]; then
            history=(--history-ref "$PAGES_HISTORY_REF")
          fi
          python3 scripts/release-artifacts.py prepare-pages target/pages "${history[@]}"

      - name: 核对三库公开 API 兼容
        run: python3 scripts/release-artifacts.py compat --repository target/pages

      - name: 从独立工程运行暂存 SDK
        run: python3 scripts/release-artifacts.py sdk target/pages

      - name: 计算服务 ZIP 的 SHA-256
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: MainMosire/target
        run: |
          set -euo pipefail
          zip="mosire-server-${PUBLISH_VERSION}.zip"
          sha256sum "$zip" > "$zip.sha256"

      - name: 保存已验收的服务制品
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mosire-server
          if-no-files-found: error
          path: |
            MainMosire/target/mosire-server-${{ env.PUBLISH_VERSION }}.zip
            MainMosire/target/mosire-server-${{ env.PUBLISH_VERSION }}.zip.sha256

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/pages
          publish_branch: gh-pages
          keep_files: true

  server-release:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mosire-server

      - name: 发布服务 ZIP 与校验和
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="mosire-server-${GITHUB_REF_NAME#v}.zip"
          sha256sum -c "$zip.sha256"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "$zip" "$zip.sha256"
